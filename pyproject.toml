[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.0.0"
requires-python = ">=3.11"

dependencies = [
    "numpy==2.1.2",
    "PyYAML==6.0.1",
    "ml_dtypes==0.6.0",
    "pybind11==2.13.6",
    "nanobind==2.15.0",
    "pytest==9.1.1",
    "wheel"
]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = [
    "python",
    "build/amoeba/python_packages/amoeba_core",
]
