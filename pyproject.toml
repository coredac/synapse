[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.0.0"
requires-python = ">=3.11"

dependencies = ["PyYAML"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = [
    "python",
    "build/amoeba/python_packages/amoeba_core",
]
